name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      passed: ${{ steps.tests.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Git identity for the tests' repositories
        run: |
          git config --global user.name "Eidoloom tests"
          git config --global user.email "tests@example.com"
      - name: Backend tests
        id: tests
        run: |
          set +e
          python3 tests/test_backend.py 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          # each failing check becomes an annotation, readable on the run's page without opening the log
          grep -E '^\s*FAIL|^Traceback|^[A-Za-z_.]+Error:' test-output.txt | head -40 | sed 's/^\s*/::error title=Failed check::/'
          tail -3 test-output.txt
          echo "passed=$(grep -oE '^[0-9]+ passed, 0 failed' test-output.txt | tail -1 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          exit $status

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      passed: ${{ steps.tests.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Git identity for the tests' repositories
        run: |
          git config --global user.name "Eidoloom tests"
          git config --global user.email "tests@example.com"
      - name: Playwright and Chromium
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser tests
        id: tests
        working-directory: tests/browser
        run: |
          set +e
          report() {  # each failing check becomes an annotation: $1 is error or warning
            grep -E '^\s*FAIL|^Traceback|^[A-Za-z_.]+Error:' test-output.txt | head -40 | sed "s/^\s*/::$1 title=Failed check::/"
            tail -3 test-output.txt
          }
          STUDIO_EVIDENCE="$RUNNER_TEMP/evidence/first-run" node run.mjs 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" != 0 ]; then
            # the browser tests sometimes stall on GitHub's runners; the first failure stays visible as warnings
            echo "::warning title=Browser tests::the first run failed; running them once more"
            report warning
            cp test-output.txt "$RUNNER_TEMP/evidence/first-run/test-output.txt" 2>/dev/null || true
            STUDIO_EVIDENCE="$RUNNER_TEMP/evidence/second-run" node run.mjs 2>&1 | tee test-output.txt
            status=${PIPESTATUS[0]}
          fi
          [ "$status" = 0 ] || { report error; cp test-output.txt "$RUNNER_TEMP/evidence/second-run/test-output.txt" 2>/dev/null || true; }
          echo "passed=$(grep -oE '^[0-9]+ passed, 0 failed' test-output.txt | tail -1 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          exit $status
      - name: Keep the evidence of a failure (trace, screenshot, Studio's log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 14

  # The README's test-count badges read these files through shields.io's endpoint badge. They are written only after
  # both test jobs pass on main, to a branch of their own, so the counts are always those of a green run.
  badges:
    needs: [backend, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Write the counts to the badges branch
        env:
          BACKEND: ${{ needs.backend.outputs.passed }}
          BROWSER: ${{ needs.browser.outputs.passed }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -n "$BACKEND" ] && [ -n "$BROWSER" ] || { echo "no counts"; exit 1; }
          mkdir badges && cd badges
          printf '{"schemaVersion":1,"label":"tests","message":"%s passing","color":"brightgreen"}\n' "$BACKEND" > tests.json
          printf '{"schemaVersion":1,"label":"browser checks","message":"%s passing","color":"brightgreen"}\n' "$BROWSER" > browser.json
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests.json browser.json
          git commit -q -m "Test counts from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" badges
