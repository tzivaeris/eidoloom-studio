name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Git identity for the tests' repositories
        run: |
          git config --global user.name "Eidoloom tests"
          git config --global user.email "tests@example.com"
      - name: Backend tests
        run: python3 tests/test_backend.py
