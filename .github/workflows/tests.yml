name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Git identity for the tests' repositories
        run: |
          git config --global user.name "Eidoloom tests"
          git config --global user.email "tests@example.com"
      - name: Backend tests
        run: |
          set +e
          python3 tests/test_backend.py 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          # each failing check becomes an annotation, readable on the run's page without opening the log
          grep -E '^\s*FAIL|Error|Traceback' test-output.txt | head -40 | sed 's/^\s*/::error title=Failed check::/'
          tail -3 test-output.txt
          exit $status

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Git identity for the tests' repositories
        run: |
          git config --global user.name "Eidoloom tests"
          git config --global user.email "tests@example.com"
      - name: Playwright and Chromium
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: tests/browser
        run: |
          set +e
          report() {  # each failing check becomes an annotation: $1 is error or warning
            grep -E '^\s*FAIL|Error|Traceback' test-output.txt | head -40 | sed "s/^\s*/::$1 title=Failed check::/"
            tail -3 test-output.txt
          }
          node run.mjs 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" != 0 ]; then
            # the browser tests sometimes stall on GitHub's runners; the first failure stays visible as warnings
            echo "::warning title=Browser tests::the first run failed; running them once more"
            report warning
            node run.mjs 2>&1 | tee test-output.txt
            status=${PIPESTATUS[0]}
          fi
          [ "$status" = 0 ] || report error
          exit $status
